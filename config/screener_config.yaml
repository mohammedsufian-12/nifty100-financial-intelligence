presets:

  quality_compounder:
    name: "Quality Compounder"
    filters:
      return_on_equity_pct:
        min: 15
      debt_to_equity:
        max: 1.0
      free_cash_flow_cr:
        min: 0
      revenue_cagr_5yr:
        min: 10
    ranking_metric: "composite_score"
    ranking_order: "desc"

  value_pick:
    name: "Value Pick"
    filters:
      pe_ratio:
        max: 20
      pb_ratio:
        max: 3.0
      debt_to_equity:
        max: 2.0
      dividend_yield_pct:
        min: 1
    ranking_metric: "fcf_yield_pct"
    ranking_order: "desc"

  growth_accelerator:
    name: "Growth Accelerator"
    filters:
      pat_cagr_5yr:
        min: 20
      revenue_cagr_5yr:
        min: 15
      debt_to_equity:
        max: 2.0
    ranking_metric: "pat_cagr_5yr"
    ranking_order: "desc"

  dividend_champion:
    name: "Dividend Champion"
    filters:
      dividend_yield_pct:
        min: 2
      dividend_payout_pct:
        max: 80
      free_cash_flow_cr:
        min: 0
    ranking_metric: "dividend_yield_pct"
    ranking_order: "desc"

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    filters:
      debt_to_equity:
        equals: 0
      return_on_equity_pct:
        min: 12
      revenue_cr:
        min: 5000
    ranking_metric: "return_on_equity_pct"
    ranking_order: "desc"

  turnaround_watch:
    name: "Turnaround Watch"
    filters:
      revenue_cagr_3yr:
        min: 10
      free_cash_flow_improving:
        equals: true
      debt_to_equity_declining:
        equals: true
    ranking_metric: "revenue_cagr_3yr"
    ranking_order: "desc"


composite_score:
  weights:
    profitability: 0.35
    cash_quality: 0.30
    growth: 0.20
    leverage: 0.15

  profitability:
    return_on_equity_pct: 0.15
    return_on_capital_employed_pct: 0.10
    net_profit_margin_pct: 0.10

  cash_quality:
    fcf_cagr_5yr: 0.15
    cfo_to_profit_ratio: 0.10
    free_cash_flow_positive: 0.05

  growth:
    revenue_cagr_5yr: 0.10
    pat_cagr_5yr: 0.10

  leverage:
    debt_to_equity: 0.10
    interest_coverage: 0.05